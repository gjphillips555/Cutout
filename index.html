<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cutout — keep the subject</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #121018;
        --bg-2: #1b1724;
        --panel: #221d2c;
        --line: rgba(255, 255, 255, 0.1);
        --text: #f4f0fa;
        --muted: #9a90a8;
        --accent: #7b3fd6;
        --accent-2: #f3c14a;
        --ok: #5ee0a0;
        --danger: #ff6b7a;
        --radius: 18px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
      body {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100dvh;
      }
      h1, h2 { font-family: Sora, sans-serif; margin: 0; }
      button, input, select { font: inherit; }
      button:not(:disabled) { cursor: pointer; }
      a { color: inherit; }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(18, 16, 24, 0.9);
        backdrop-filter: blur(12px);
      }
      .brand { display: flex; flex-direction: column; gap: 2px; }
      .brand h1 { font-size: 1.15rem; letter-spacing: -0.03em; }
      .brand p { margin: 0; color: var(--muted); font-size: 0.8rem; }
      .back {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.85rem;
        border: 1px solid var(--line);
        padding: 8px 12px;
        border-radius: 999px;
      }
      .back:hover { color: var(--text); }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        min-height: 0;
      }
      @media (max-width: 900px) {
        main { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 1fr) auto; }
      }

      .stage {
        min-height: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background-image:
          linear-gradient(45deg, #1a1622 25%, transparent 25%),
          linear-gradient(-45deg, #1a1622 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #1a1622 75%),
          linear-gradient(-45deg, transparent 75%, #1a1622 75%);
        background-size: 28px 28px;
        background-position: 0 0, 0 14px, 14px -14px, -14px 0;
        background-color: #100e16;
      }
      .stage.light {
        background-color: #ece8f2;
        background-image:
          linear-gradient(45deg, #ddd8e6 25%, transparent 25%),
          linear-gradient(-45deg, #ddd8e6 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #ddd8e6 75%),
          linear-gradient(-45deg, transparent 75%, #ddd8e6 75%);
      }
      .stage.black { background: #07060a; background-image: none; }

      .drop {
        width: min(720px, 100%);
        border: 1.5px dashed rgba(255,255,255,.22);
        border-radius: var(--radius);
        padding: 48px 24px;
        text-align: center;
        background: rgba(18, 16, 24, 0.72);
      }
      .drop.over { border-color: var(--accent); background: rgba(123, 63, 214, 0.12); }
      .drop h2 { font-size: 1.4rem; margin-bottom: 8px; }
      .drop p { color: var(--muted); margin: 0 0 20px; }
      .file-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 600;
      }
      canvas.preview {
        max-width: 100%;
        max-height: min(72dvh, 720px);
        width: auto;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 24px 60px rgba(0,0,0,.4);
      }

      aside {
        border-left: 1px solid var(--line);
        background: var(--bg-2);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow: auto;
      }
      @media (max-width: 900px) {
        aside { border-left: 0; border-top: 1px solid var(--line); }
      }
      label.row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 0.9rem;
      }
      label.stack { display: grid; gap: 8px; font-size: 0.85rem; color: var(--muted); }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .switch {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; font-size: 0.9rem;
      }
      .switch input { width: 18px; height: 18px; accent-color: var(--accent); }
      .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .modes button, .bg-toggle button, .actions button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .modes button.on { background: var(--accent); border-color: transparent; }
      .bg-toggle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
      .bg-toggle button.on { outline: 2px solid var(--accent); }
      .actions { display: grid; gap: 8px; margin-top: auto; }
      .actions .primary {
        background: var(--accent);
        border-color: transparent;
        font-weight: 700;
        padding: 14px;
      }
      .actions .primary:disabled { opacity: 0.45; }
      .status {
        min-height: 1.2em;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .status.err { color: var(--danger); }
      .hint { font-size: 0.78rem; color: var(--muted); line-height: 1.45; }
      progress { width: 100%; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Cutout</h1>
        <p>Identify the subject. Keep interiors. Drop the backdrop.</p>
      </div>
    </header>
    <main>
      <section class="stage" id="stage">
        <div class="drop" id="drop">
          <h2>Drop an image</h2>
          <p>Logos, product shots, anything on a backdrop. Processing stays in this browser.</p>
          <button class="file-btn" id="pick" type="button">Choose file</button>
          <input id="file" type="file" accept="image/*" hidden />
        </div>
        <canvas class="preview" id="view" hidden></canvas>
      </section>
      <aside>
        <div class="modes">
          <button type="button" id="modeAuto" class="on">Studio cut</button>
          <button type="button" id="modeAi">Neural cut</button>
        </div>
        <p class="hint" id="modeHint">
          Floods from the edges, then fills enclosed holes — so white lettering is not punched out.
        </p>
        <label class="stack">
          Edge tolerance
          <input id="tol" type="range" min="8" max="90" value="28" />
        </label>
        <label class="stack">
          Feather
          <input id="feather" type="range" min="0" max="8" value="1" />
        </label>
        <label class="switch"><span>Fill enclosed holes</span><input id="holes" type="checkbox" checked /></label>
        <label class="switch"><span>Protect light fills</span><input id="protect" type="checkbox" checked /></label>
        <label class="switch"><span>Defringe grey halo</span><input id="defringe" type="checkbox" checked /></label>
        <div>
          <p class="hint" style="margin: 0 0 8px">Preview surface</p>
          <div class="bg-toggle">
            <button type="button" id="bgCheck" class="on">Checker</button>
            <button type="button" id="bgDark">Dark</button>
            <button type="button" id="bgLight">Light</button>
          </div>
        </div>
        <progress id="bar" value="0" max="100" hidden></progress>
        <p class="status" id="status"></p>
        <div class="actions">
          <button class="primary" id="run" type="button" disabled>Cut background</button>
          <button id="download" type="button" disabled>Download PNG</button>
          <button id="reset" type="button">New image</button>
        </div>
      </aside>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const fileInput = $("file");
      const drop = $("drop");
      const view = $("view");
      const stage = $("stage");
      const statusEl = $("status");
      const bar = $("bar");
      const runBtn = $("run");
      const dlBtn = $("download");

      let source = null;
      let result = null;
      let mode = "auto";
      let neural = null;

      function setStatus(msg, err = false) {
        statusEl.textContent = msg;
        statusEl.className = "status" + (err ? " err" : "");
      }

      $("pick").onclick = () => fileInput.click();
      fileInput.onchange = () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); };
      ["dragenter", "dragover"].forEach((ev) => {
        drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); });
      });
      ["dragleave", "drop"].forEach((ev) => {
        drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); });
      });
      drop.addEventListener("drop", (e) => {
        const f = e.dataTransfer.files[0];
        if (f) loadFile(f);
      });

      $("modeAuto").onclick = () => setMode("auto");
      $("modeAi").onclick = () => setMode("ai");
      function setMode(next) {
        mode = next;
        $("modeAuto").classList.toggle("on", next === "auto");
        $("modeAi").classList.toggle("on", next === "ai");
        $("modeHint").textContent =
          next === "auto"
            ? "Floods from the edges, then fills enclosed holes — so white lettering is not punched out."
            : "Downloads a subject model in-browser, then hole-fills so interiors stay solid.";
      }

      function setStage(kind) {
        stage.classList.remove("light", "black");
        if (kind === "light") stage.classList.add("light");
        if (kind === "dark") stage.classList.add("black");
        $("bgCheck").classList.toggle("on", kind === "check");
        $("bgDark").classList.toggle("on", kind === "dark");
        $("bgLight").classList.toggle("on", kind === "light");
      }
      $("bgCheck").onclick = () => setStage("check");
      $("bgDark").onclick = () => setStage("dark");
      $("bgLight").onclick = () => setStage("light");

      function loadFile(file) {
        if (!file.type.startsWith("image/")) {
          setStatus("That file is not an image.", true);
          return;
        }
        const img = new Image();
        img.onload = () => {
          source = img;
          result = null;
          drop.hidden = true;
          view.hidden = false;
          drawImage(img);
          runBtn.disabled = false;
          dlBtn.disabled = true;
          setStatus(img.naturalWidth + " × " + img.naturalHeight + " — ready to cut.");
        };
        img.onerror = () => setStatus("Could not read that image.", true);
        img.src = URL.createObjectURL(file);
      }

      function drawImage(img) {
        const max = 1600;
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        if (Math.max(w, h) > max) {
          const s = max / Math.max(w, h);
          w = Math.round(w * s);
          h = Math.round(h * s);
        }
        view.width = w;
        view.height = h;
        const ctx = view.getContext("2d");
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
      }

      function sampleCorners(data, w, h) {
        const pts = [[0,0],[w-1,0],[0,h-1],[w-1,h-1],[w>>1,0],[0,h>>1],[w-1,h>>1],[w>>1,h-1]];
        let r=0,g=0,b=0;
        for (const [x,y] of pts) {
          const i = (y * w + x) * 4;
          r += data[i]; g += data[i+1]; b += data[i+2];
        }
        const n = pts.length;
        return [r/n, g/n, b/n];
      }

      function dist2(r,g,b, cr,cg,cb) {
        const dr=r-cr, dg=g-cg, db=b-cb;
        return dr*dr + dg*dg + db*db;
      }

      function floodBg(data, w, h, tol) {
        const bg = sampleCorners(data, w, h);
        const thresh = (tol / 100) * 255;
        const t2 = thresh * thresh * 3;
        const seen = new Uint8Array(w * h);
        const q = [];
        function push(x,y) {
          const id = y*w+x;
          if (seen[id]) return;
          const i = id*4;
          if (dist2(data[i], data[i+1], data[i+2], bg[0], bg[1], bg[2]) > t2) return;
          seen[id] = 1;
          q.push(id);
        }
        for (let x=0;x<w;x++) { push(x,0); push(x,h-1); }
        for (let y=0;y<h;y++) { push(0,y); push(w-1,y); }
        while (q.length) {
          const id = q.pop();
          const x = id % w, y = (id / w) | 0;
          if (x>0) push(x-1,y);
          if (x<w-1) push(x+1,y);
          if (y>0) push(x,y-1);
          if (y<h-1) push(x,y+1);
        }
        return seen;
      }

      function fillHoles(bgMask, w, h) {
        const keep = new Uint8Array(w * h);
        for (let i=0;i<keep.length;i++) keep[i] = bgMask[i] ? 0 : 1;
        return keep;
      }

      function protectLights(data, keep, w, h) {
        for (let i=0;i<keep.length;i++) {
          if (keep[i]) continue;
          const p = i*4;
          const r=data[p], g=data[p+1], b=data[p+2];
          const lum = 0.2126*r + 0.7152*g + 0.0722*b;
          if (lum > 242 && Math.abs(r-g)<14 && Math.abs(r-b)<14) keep[i] = 1;
        }
      }

      function featherMask(keep, w, h, radius) {
        if (radius <= 0) {
          const a = new Float32Array(keep.length);
          for (let i=0;i<keep.length;i++) a[i] = keep[i] ? 1 : 0;
          return a;
        }
        const src = new Float32Array(keep.length);
        for (let i=0;i<keep.length;i++) src[i] = keep[i] ? 1 : 0;
        const tmp = new Float32Array(keep.length);
        const r = radius;
        for (let y=0;y<h;y++) {
          for (let x=0;x<w;x++) {
            let s=0, c=0;
            for (let k=-r;k<=r;k++) {
              const xx = Math.min(w-1, Math.max(0, x+k));
              s += src[y*w+xx]; c++;
            }
            tmp[y*w+x] = s/c;
          }
        }
        const out = new Float32Array(keep.length);
        for (let y=0;y<h;y++) {
          for (let x=0;x<w;x++) {
            let s=0, c=0;
            for (let k=-r;k<=r;k++) {
              const yy = Math.min(h-1, Math.max(0, y+k));
              s += tmp[yy*w+x]; c++;
            }
            out[y*w+x] = s/c;
          }
        }
        return out;
      }

      function applyCut(imgData, alpha, defringe) {
        const d = imgData.data;
        const w = imgData.width, h = imgData.height;
        const B = sampleCorners(d, w, h);
        for (let i=0;i<alpha.length;i++) {
          const a = alpha[i];
          const p = i*4;
          if (a <= 0.001) { d[p+3] = 0; continue; }
          if (defringe && a < 0.999) {
            const ia = 1 - a;
            d[p]   = Math.max(0, Math.min(255, (d[p]   - ia*B[0]) / a));
            d[p+1] = Math.max(0, Math.min(255, (d[p+1] - ia*B[1]) / a));
            d[p+2] = Math.max(0, Math.min(255, (d[p+2] - ia*B[2]) / a));
          }
          d[p+3] = Math.round(a * 255);
        }
      }

      async function loadNeural() {
        if (neural) return neural;
        setStatus("Loading subject model… first time can take a minute.");
        const mod = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.2");
        setStatus("Building the cutter…");
        neural = await mod.pipeline("image-segmentation", "Xenova/modnet", { progress_callback: (x) => {
          if (x.status === "progress" && x.total) {
            bar.hidden = false;
            bar.value = Math.round((x.loaded / x.total) * 100);
            setStatus("Downloading model " + bar.value + "%");
          }
        }});
        return neural;
      }

      async function neuralKeep(canvas) {
        const pipe = await loadNeural();
        const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
        const out = await pipe(blob);
        const mask = out[0].mask;
        const keep = new Uint8Array(mask.width * mask.height);
        const buf = mask.data;
        for (let i=0;i<keep.length;i++) keep[i] = buf[i] > 0.5 ? 1 : 0;
        if (mask.width !== canvas.width || mask.height !== canvas.height) {
          const c = document.createElement("canvas");
          c.width = mask.width; c.height = mask.height;
          const ctx = c.getContext("2d");
          const imgd = ctx.createImageData(mask.width, mask.height);
          for (let i=0;i<keep.length;i++) {
            const v = keep[i]*255;
            imgd.data[i*4] = v; imgd.data[i*4+1]=v; imgd.data[i*4+2]=v; imgd.data[i*4+3]=255;
          }
          ctx.putImageData(imgd,0,0);
          const c2 = document.createElement("canvas");
          c2.width = canvas.width; c2.height = canvas.height;
          c2.getContext("2d").drawImage(c, 0, 0, canvas.width, canvas.height);
          const scaled = c2.getContext("2d").getImageData(0,0,canvas.width,canvas.height).data;
          const k2 = new Uint8Array(canvas.width * canvas.height);
          for (let i=0;i<k2.length;i++) k2[i] = scaled[i*4] > 127 ? 1 : 0;
          return k2;
        }
        return keep;
      }

      $("run").onclick = async () => {
        if (!source) return;
        runBtn.disabled = true;
        try {
          drawImage(source);
          const ctx = view.getContext("2d");
          const imgd = ctx.getImageData(0, 0, view.width, view.height);
          const w = imgd.width, h = imgd.height;
          let keep;
          if (mode === "ai") {
            keep = await neuralKeep(view);
          } else {
            const bg = floodBg(imgd.data, w, h, Number($("tol").value));
            keep = fillHoles(bg, w, h);
          }
          if ($("holes").checked && mode === "ai") {
            const edge = new Uint8Array(keep.length);
            const q = [];
            const push = (x,y) => {
              const id=y*w+x;
              if (keep[id] || edge[id]) return;
              edge[id]=1; q.push(id);
            };
            for (let x=0;x<w;x++) { push(x,0); push(x,h-1); }
            for (let y=0;y<h;y++) { push(0,y); push(w-1,y); }
            while (q.length) {
              const id=q.pop();
              const x=id%w, y=(id/w)|0;
              if (x>0) push(x-1,y);
              if (x<w-1) push(x+1,y);
              if (y>0) push(x,y-1);
              if (y<h-1) push(x,y+1);
            }
            for (let i=0;i<keep.length;i++) if (!keep[i] && !edge[i]) keep[i]=1;
          }
          if ($("protect").checked) protectLights(imgd.data, keep, w, h);
          const alpha = featherMask(keep, w, h, Number($("feather").value));
          applyCut(imgd, alpha, $("defringe").checked);
          ctx.putImageData(imgd, 0, 0);
          result = view;
          dlBtn.disabled = false;
          bar.hidden = true;
          setStatus("Cut complete. White interiors kept. Download the PNG.");
        } catch (err) {
          console.error(err);
          bar.hidden = true;
          setStatus((err && err.message) || "Cut failed — try Studio cut.", true);
        } finally {
          runBtn.disabled = false;
        }
      };

      $("download").onclick = () => {
        if (!result) return;
        result.toBlob((blob) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "cutout.png";
          a.click();
        }, "image/png");
      };

      $("reset").onclick = () => {
        source = null; result = null;
        view.hidden = true;
        drop.hidden = false;
        runBtn.disabled = true;
        dlBtn.disabled = true;
        setStatus("");
      };
    </script>
  </body>
</html>
